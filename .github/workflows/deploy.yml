name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject PrimeUI license key
        env:
          PRIME_UI_LICENSE_KEY: ${{ secrets.PRIME_UI_LICENSE_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/environments/environment.ts';
            const key = process.env.PRIME_UI_LICENSE_KEY || '';
            const content = fs.readFileSync(path, 'utf8').replace(
              \"primeUiLicenseKey: ''\",
              \`primeUiLicenseKey: '\${key}'\`
            );
            fs.writeFileSync(path, content);
          "

      - name: Build Angular
        run: |
          npm run build -- --base-href="/angular22-prime-ng-ag-grid/"

      # GitHub Pages serves this file for paths that do not exist on disk.
      # Keeping a copy of the Angular entry point lets the client router handle
      # deep links such as /profile/3.
      - name: Add SPA fallback page
        run: cp dist/angular22-prime-ng-ag-grid/browser/index.html dist/angular22-prime-ng-ag-grid/browser/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular22-prime-ng-ag-grid/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
